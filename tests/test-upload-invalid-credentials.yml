name: Test upload attempt with invalid AWS credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create files to upload
        run: |
          mkdir -p /tmp/upload-src/sub
          echo "hello" > /tmp/upload-src/a.txt
          echo "world" > /tmp/upload-src/sub/b.txt
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: AKIAINVALIDTESTKEY00
          AWS_SECRET_ACCESS_KEY: invalidtestsecretkeyinvalidtestsecretkey
          AWS_EC2_METADATA_DISABLED: "true"
        with:
          path: /tmp/upload-src
          s3-bucket: actionchain-harness-nonexistent-bucket-test
          s3-prefix: test/prefix
          if-no-files-found: error
      - name: Assert upload was attempted and rejected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected upload with invalid credentials to fail"
            exit 1
          fi
          echo "PASS"
