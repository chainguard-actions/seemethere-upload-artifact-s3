name: Test no files found with ignore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-artifact
          path: /tmp/nonexistent-upload-path-12345
          if-no-files-found: ignore
          s3-bucket: some-bucket
          region: us-west-2
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when no files found and if-no-files-found=ignore"
            exit 1
          fi
          echo "PASS"
